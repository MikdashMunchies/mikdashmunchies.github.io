<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 320 290">
  <style>
    .steam path { animation: steam 2.4s ease-in-out infinite; }
    .steam path:nth-child(2) { animation-delay: .5s; }
    .steam path:nth-child(3) { animation-delay: 1s; }
    @keyframes steam { 0% { opacity: 0; transform: translateY(8px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
    @media (prefers-reduced-motion: reduce) { .steam path { animation: none; } }
  </style>
  <ellipse cx="160" cy="238" rx="138" ry="13" fill="#1A1410" opacity=".12"/>

  <!-- Pizza slice -->
  <path d="M200 98 L302 118 L238 228 Z" fill="#FFD15C" stroke="#1A1410" stroke-width="4" stroke-linejoin="round"/>
  <path d="M194 90 Q250 92 306 110 L300 126 Q250 110 200 106 Z" fill="#D9893A" stroke="#1A1410" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#C0392B" stroke="#1A1410" stroke-width="3">
    <circle cx="240" cy="132" r="11"/>
    <circle cx="270" cy="142" r="10"/>
    <circle cx="246" cy="168" r="10"/>
    <circle cx="240" cy="198" r="7"/>
  </g>

  <!-- Pasta bowl: fork, pasta, then bowl -->
  <path d="M150 70 L128 140" stroke="#1A1410" stroke-width="12" stroke-linecap="round"/>
  <path d="M150 70 L128 140" stroke="#D9DDE3" stroke-width="5" stroke-linecap="round"/>
  <path d="M38 152 C44 104 176 102 184 152 Z" fill="#F4C95D" stroke="#1A1410" stroke-width="4" stroke-linejoin="round"/>
  <g fill="none" stroke="#C99A2E" stroke-width="3" stroke-linecap="round">
    <path d="M58 140 q12 -14 24 0 t24 0"/>
    <path d="M110 136 q12 -14 24 0 t24 0"/>
    <path d="M76 124 q12 -12 24 0 t24 0"/>
  </g>
  <path d="M84 120 C90 102 132 100 140 118 C142 130 90 134 84 120 Z" fill="#D2341B" stroke="#1A1410" stroke-width="3.5" stroke-linejoin="round"/>
  <ellipse cx="118" cy="110" rx="9" ry="5" fill="#3E9B4F" stroke="#1A1410" stroke-width="2.5" transform="rotate(-20 118 110)"/>
  <path d="M26 152 L196 152 Q190 224 111 226 Q32 224 26 152 Z" fill="#FFFFFF" stroke="#1A1410" stroke-width="4" stroke-linejoin="round"/>
  <path d="M42 170 L180 170" stroke="#1A1410" stroke-width="3" opacity=".15"/>

  <g class="steam" fill="none" stroke="#1A1410" stroke-width="4" stroke-linecap="round" opacity=".35">
    <path d="M70 80 q-10 -14 0 -28 t0 -28"/>
    <path d="M110 66 q-10 -14 0 -28 t0 -28"/>
    <path d="M180 80 q-10 -14 0 -28 t0 -28"/>
  </g>
</svg>

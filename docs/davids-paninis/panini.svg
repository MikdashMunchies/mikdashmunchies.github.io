<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 -54 320 304">
  <style>
    .steam path { animation: steam 2.4s ease-in-out infinite; }
    .steam path:nth-child(2) { animation-delay: .5s; }
    .steam path:nth-child(3) { animation-delay: 1s; }
    @keyframes steam { 0% { opacity: 0; transform: translateY(8px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
    @media (prefers-reduced-motion: reduce) { .steam path { animation: none; } }
  </style>

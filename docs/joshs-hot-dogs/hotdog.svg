<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 320 290">
  <style>
    .steam path { animation: steam 2.4s ease-in-out infinite; }
    .steam path:nth-child(2) { animation-delay: .5s; }
    .steam path:nth-child(3) { animation-delay: 1s; }
    @keyframes steam { 0% { opacity: 0; transform: translateY(8px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
    @media (prefers-reduced-motion: reduce) { .steam path { animation: none; } }
  </style>
  <ellipse cx="165" cy="238" rx="138" ry="13" fill="#1A1410" opacity=".12"/>

  <!-- Fries: sticks first, carton in front -->
  <g fill="#FFC94A" stroke="#1A1410" stroke-width="3.5" stroke-linejoin="round">
    <rect x="224" y="66" width="12" height="70" rx="3" transform="rotate(-8 230 100)"/>
    <rect x="240" y="54" width="12" height="80" rx="3" transform="rotate(-3 246 94)"/>
    <rect x="256" y="58" width="12" height="78" rx="3" transform="rotate(4 262 96)"/>
    <rect x="272" y="68" width="12" height="70" rx="3" transform="rotate(9 278 102)"/>
    <rect x="248" y="76" width="12" height="60" rx="3"/>
  </g>
  <path d="M212 118 L296 118 L284 226 L224 226 Z" fill="#D72638" stroke="#1A1410" stroke-width="4" stroke-linejoin="round"/>
  <path d="M232 160 l9 -18 l9 18 l9 -18 l9 18 l9 -18" fill="none" stroke="#FFC233" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hot dog -->
  <path d="M38 168 Q36 128 74 128 L178 128 Q214 128 212 168 Z" fill="#F2B66D" stroke="#1A1410" stroke-width="4" stroke-linejoin="round"/>
  <rect x="18" y="146" width="214" height="34" rx="17" fill="#C0442B" stroke="#1A1410" stroke-width="4"/>
  <polyline points="36,163 52,153 68,165 84,153 100,165 116,153 132,165 148,153 164,165 180,153 196,165 212,155" fill="none" stroke="#FFD23F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28 170 Q28 214 70 214 L182 214 Q224 214 224 170 Z" fill="#E9A95B" stroke="#1A1410" stroke-width="4" stroke-linejoin="round"/>

  <g class="steam" fill="none" stroke="#1A1410" stroke-width="4" stroke-linecap="round" opacity=".35">
    <path d="M80 110 q-10 -14 0 -28 t0 -28"/>
    <path d="M125 100 q-10 -14 0 -28 t0 -28"/>
    <path d="M170 110 q-10 -14 0 -28 t0 -28"/>
  </g>
</svg>

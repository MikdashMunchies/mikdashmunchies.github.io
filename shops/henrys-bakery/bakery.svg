<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260">
  <style>
    .sparkle { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .sparkle:nth-of-type(2) { animation-delay: .8s; }
    .sparkle:nth-of-type(3) { animation-delay: 1.6s; }
    @keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .sparkle { animation: none; } }
  </style>
  <ellipse cx="165" cy="238" rx="135" ry="13" fill="#1A1410" opacity=".12"/>

